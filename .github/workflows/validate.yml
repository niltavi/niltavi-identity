name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build and security checks
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDENTITY_ACCEPTANCE_DATABASE_URL: postgresql://identity_lab:identity_lab@127.0.0.1:55450/identity_lab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Scan Git history for credentials
        run: |
          scan_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            --output "$scan_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scan_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact=100 --log-opts=--all
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit
      - run: npm run check
      - run: npm run build
      - run: docker compose up -d --wait db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lab
      - run: node acceptance/browser-auth.mjs
      - run: node acceptance/prd.mjs
      - run: npx playwright test --config playwright.service.config.ts
