services:
  migrate:
    image: node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    build: !reset null
    working_dir: /identity
    user: '1000:1000'
    entrypoint: [node, dist/cli.js]
    environment:
      NODE_ENV: production
    volumes:
      - ${IDENTITY_RUNTIME_DIR:?set the staged runtime directory}:/identity:ro
  identity:
    image: node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    build: !reset null
    working_dir: /identity
    user: '1000:1000'
    entrypoint: [node, dist/cli.js]
    command: [serve]
    environment:
      NODE_ENV: production
    volumes:
      - ${IDENTITY_RUNTIME_DIR:?set the staged runtime directory}:/identity:ro
